name: Verificar site

# Roda a cada push na main e em pull requests: confere arquivos, tamanhos, links internos,
# dados e carimbos de atualização (verificar_site.py). Se falhar, o GitHub avisa por e-mail.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar o site
        run: python verificar_site.py
